<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Visa4Bali · Status data visa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=23">
<style>
  /* internal checklist for Ari, not part of the site */
  .dv{width:100%;border-collapse:collapse;font-size:var(--t-small);margin-top:32px}
  .dv th,.dv td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .dv th{font-size:var(--t-label);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .dv .ok{color:var(--sea)}
  .dv .no{color:var(--merah);font-weight:500}
  .dv small{display:block;color:var(--muted)}
  .dv-wrap{overflow-x:auto}
</style>
</head>
<body>
<main class="sec">
  <div class="wrap">
    <h1 class="h2">Status data halaman visa</h1>
    <p class="lead">Satu baris per halaman visa. <b class="no" style="color:var(--merah)">Kosong</b> = bagian yang masih tampil sebagai kotak "Data belum ada". Sumber: "Woo #…" = deskripsi produk WooCommerce di visa4bali.com, "Ari 31/10" = revisi harga Ari tanggal 31 Oktober.</p>
    <div class="dv-wrap"><table class="dv" id="dv"></table></div>
  </div>
</main>
<script src="site.js?v=14"></script>
<script src="detail.js?v=2"></script>
<script>
  var cols = [["short", "Pembuka"], ["who", "Untuk siapa"], ["need", "Dokumen"], ["incl", "Termasuk harga"], ["faq", "Tanya jawab"]];
  var rows = [];
  V4B.groups.forEach(function (g) {
    g.items.forEach(function (v) {
      if (!v.slug) return;
      var d = V4B.detail[v.slug] || {};
      rows.push("<tr><td><a href=\"" + V4B.url(v) + "\">" + V4B.label(v) + "</a><small>" + g.label + "</small></td><td>" + (d.src || "–") + "</td>" +
        cols.map(function (c) {
          if (c[0] === "who" && v.route !== "chat" && !d.who) return "<td>–</td>";
          return d[c[0]] ? '<td class="ok">ada</td>' : '<td class="no">Kosong</td>';
        }).join("") + "</tr>");
    });
  });
  document.getElementById("dv").innerHTML = "<thead><tr><th>Visa</th><th>Sumber</th>" + cols.map(function (c) { return "<th>" + c[1] + "</th>"; }).join("") +
    "</tr></thead><tbody>" + rows.join("") + "</tbody>";
</script>
</body>
</html>
